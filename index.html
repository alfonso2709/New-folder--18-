<!DOCTYPE html>
<html>
<head>
  <title>Tip Calculator</title>
</head>

<body>

  <h1>Tip Calculator</h1>

  <label>Subtotal:</label>
  <input type="number" id="subtotal" value="67.72">

  <br><br>

  <label>Tip Percentage (0.2 = 20%):</label>
  <input type="number" id="tip" value="0.2">

  <br><br>

  <button>Calculate Tip</button>

  <p id="tipAmount">Tip Amount: --</p>
  <p id="total">Total Bill: --</p>

</body>
</html>
