<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projects - Intro to JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container my-5">
        <h1 class="mb-4 text-center">Mini Projects - Intro to JS</h1>

        <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Tip Calculator</h2>
                    </div>
                    <div class="card-body">
                        <label for="subtotal" class="form-label">Subtotal ($)</label>
                        <input id="subtotal" class="form-control mb-3" type="number" min="0" step="any">
                        <label for="tipPercentage" class="form-label">Tip Percentage (as decimal, e.g., 0.2)</label>
                        <input id="tipPercentage" class="form-control mb-3" type="number" min="0" step="any">
                        <button id="calculateTip" class="btn btn-primary" type="button">Calculate Tip</button>
                    </div>
                    <div class="card-footer text-muted">Tip Amount: <span id="tipAmount">$0.00</span></div>
                    <div class="card-footer text-muted">Total Bill: <span id="tipTotal">$0.00</span></div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Paycheck Calculator</h2>
                    </div>
                    <div class="card-body">
                        <label for="hoursWorked" class="form-label">Hours Worked</label>
                        <input id="hoursWorked" class="form-control mb-3" type="number" min="0" step="any">
                        <label for="hourlyRate" class="form-label">Hourly Rate ($)</label>
                        <input id="hourlyRate" class="form-control mb-3" type="number" min="0" step="any">
                        <button id="calculatePaycheck" class="btn btn-primary" type="button">Calculate Paycheck</button>
                    </div>
                    <div class="card-footer text-muted">Paycheck Amount: <span id="paycheckAmount">$0.00</span></div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Grade Calculator</h2>
                    </div>
                    <div class="card-body">
                        <label for="pointsEarned" class="form-label">Points Earned</label>
                        <input id="pointsEarned" class="form-control mb-3" type="number" min="0" step="any">
                        <label for="totalPoints" class="form-label">Total Points</label>
                        <input id="totalPoints" class="form-control mb-3" type="number" min="0" step="any">
                        <button id="calculateGrade" class="btn btn-primary" type="button">Calculate Grade</button>
                    </div>
                    <div class="card-footer text-muted">Grade: <span id="gradeResult">0.00%</span></div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h2 class="h5 mb-0">Gas Cost Calculator</h2>
                    </div>
                    <div class="card-body">
                        <label for="tankSize" class="form-label">Tank Size (gallons)</label>
                        <input id="tankSize" class="form-control mb-3" type="number" min="0" step="any">
                        <label for="pricePerGallon" class="form-label">Price Per Gallon ($)</label>
                        <input id="pricePerGallon" class="form-control mb-3" type="number" min="0" step="any">
                        <button id="calculateGasCost" class="btn btn-primary" type="button">Calculate Gas Cost</button>
                    </div>
                    <div class="card-footer text-muted">Cost to Fill Up: <span id="gasCost">$0.00</span></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
